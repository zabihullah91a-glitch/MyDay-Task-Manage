<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Login - Darlo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #090d1e, #211747);
            color: white;
        }

        .login-box {
            width: 400px;
            padding: 40px;
            background: #151d35;
            border: 1px solid #34365f;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #9b80ff;
        }

        h2 {
            text-align: center;
            margin: 25px 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #929bb5;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #343e5e;
            border-radius: 10px;
            background: #202a45;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #9475ff;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #8065f5, #a56cff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .bottom {
            text-align: center;
            margin-top: 25px;
            color: #a5aec5;
        }

        a {
            color: #a58aff;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            background: #542b42;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            color: #ffb9ce;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">

       <div class="logo">✦ Darlo</div>

        <h2>Welcome Back!</h2>

        <p class="subtitle">Login to manage your daily tasks.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login →</button>

        </form>

        <div class="bottom">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Sign Up</a>
        </div>

    </div>

</body>
</html>
